<!-- =====================================================================
     NODBU · Plantilla editable de imagen social (1200x630)
     Cambia TITULO/BAJADA, abre en el navegador y captura a 1200x630,
     o rasteriza:  chrome --headless --window-size=1200,630 \
                          --screenshot=og.png file://.../og-plantilla.html
     ===================================================================== -->
<!doctype html><html lang="es"><head><meta charset="utf-8">
<style>
  @font-face{font-family:'Outfit';src:url('../06_tipografias/Outfit-Variable.woff2') format('woff2');font-weight:100 900}
  @font-face{font-family:'Inter';src:url('../06_tipografias/Inter-Variable.woff2') format('woff2');font-weight:100 900}
  *{margin:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#090909;color:#fff;overflow:hidden;position:relative;
       font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;
       padding:0 88px;gap:22px}
  .trama{position:absolute;inset:0;opacity:.5;
    background-image:radial-gradient(#FF5C00 1.6px,transparent 1.6px);
    background-size:44px 44px;-webkit-mask-image:linear-gradient(120deg,#000,transparent 62%);opacity:.08}
  .halo{position:absolute;width:520px;height:520px;right:-150px;top:-190px;border-radius:50%;
        border:2px solid #FF5C00;opacity:.20}
  .halo.b{width:340px;height:340px;right:-60px;top:-100px;opacity:.30}
  .marca{display:flex;align-items:center;gap:14px;position:relative}
  .marca img{height:34px;display:block}
  .etiqueta{font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#AEAAA8;font-weight:500}
  h1{position:relative;font-family:Outfit,sans-serif;font-weight:600;font-size:66px;line-height:1.06;
     letter-spacing:-.022em;max-width:19ch}
  h1 em{font-style:normal;color:#FF5C00}
  p{position:relative;font-size:23px;line-height:1.45;color:#D4D1CF;max-width:44ch}
  .pie{position:absolute;left:88px;bottom:56px;font-size:16px;color:#8F8B8A;letter-spacing:.02em}
</style></head><body>
  <div class="trama"></div><div class="halo"></div><div class="halo b"></div>
  <div class="marca">
    <img src="../01_logo/png/nodbu-logotipo-blanco-1200w.png" alt="NODBU">
    <span class="etiqueta">Automatización a medida</span>
  </div>
  <h1>Tu operación, <em>funcionando sola</em>.</h1>
  <p>Chatbots, webs y CRMs conectados entre sí. Sin plantillas genéricas.</p>
  <div class="pie">TU-DOMINIO.com</div>
</body></html>
